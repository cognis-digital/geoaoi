[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-geoaoi"
version = "0.1.1"
description = "Area-of-interest geospatial helper: bounding boxes, geofence checks, and change-event diffs from coordinate logs."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "defense", "geoaoi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/geoaoi"

[project.scripts]
"geoaoi-emit" = "geoaoi.connect:emit_main"
geoaoi = "geoaoi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["geoaoi"]
